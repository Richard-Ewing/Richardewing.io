name: MOD v3.0 Lighthouse & QA CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Zero-Drift QA & Systems Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run MOD v3.0 QA Verification Gate
        run: node .agents/scripts/verify-qa.mjs

      - name: Run Next.js Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Start Next.js Local Server
        run: npx next start -p 3000 &

      - name: Wait for Local Server Ready
        run: npx wait-on http://127.0.0.1:3000 --timeout 30000

      - name: Run Systems Route Audit
        run: node scripts/audit-lighthouse.mjs
        env:
          AUDIT_URL: 'http://127.0.0.1:3000'
