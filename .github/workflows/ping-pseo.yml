name: Daily pSEO Index Dropper

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  ping-google:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install googleapis form-data node-fetch dotenv # Install required dependencies for ping-pseo.js if not globally available

      - name: Recreate Google Credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google-credentials.json

      - name: Run Programmatic SEO Indexer
        run: node scripts/ping-pseo.js
