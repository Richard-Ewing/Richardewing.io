# =====================================================================
# EXECUTION AUTHORITY POLICY
# Framework: Agentic Change Management
# Purpose: Map infrastructure mutations and shell commands to explicit
# human approval tiers to prevent unauthorized deployments.
# =====================================================================

apiVersion: governance.exogram.ai/v1alpha1
kind: AuthorityPolicy
metadata:
  name: infrastructure-mutation-gates
  target_systems:
    - devops-agents
    - platform-engineering-agents
spec:
  risk_scoring:
    high_risk_patterns:
      - "terraform apply"
      - "terraform destroy"
      - "kubectl delete"
      - "drop table"
      - "aws ec2 terminate"
      - "npm publish"
    
    medium_risk_patterns:
      - "npm install"
      - "yarn add"
      - "git push origin main"
      - ".github/workflows"
      - "docker push"

  authority_mapping:
    high_risk: "CAB_APPROVAL"
    medium_risk: "CODE_OWNER"
    low_risk: "AUTO"
