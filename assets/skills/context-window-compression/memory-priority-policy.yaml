# =====================================================================
# MEMORY PRIORITY POLICY
# Framework: Context Window Compression
# Purpose: Enforce strict token ceilings and define semantic eviction
# rules to prevent LLM context rot.
# =====================================================================

apiVersion: governance.exogram.ai/v1alpha1
kind: CognitivePolicy
metadata:
  name: bounded-cognition-rules
  target_systems:
    - long-horizon-coding-agents
    - autonomous-researchers
spec:
  token_ceilings:
    # The maximum tokens the LLM is ever allowed to see per turn.
    # We do NOT use the model's physical limit (e.g., 128k).
    # We use a deterministic logic limit (e.g., 16k) to guarantee high reasoning quality.
    max_total_context: 16000
    
    # How much of that budget is strictly reserved for core instructions
    reserved_system_tokens: 4000

  tier_behavior:
    tier_1_system: "NEVER_TRUNCATE"
    tier_2_recent_turn: "PRESERVE"
    tier_3_tool_outputs: "TRUNCATE_OR_SUMMARIZE"
    tier_4_stale_history: "EVICT"

  # How many interaction turns until a message is considered "Stale History" and evicted.
  eviction_threshold_turns: 5
