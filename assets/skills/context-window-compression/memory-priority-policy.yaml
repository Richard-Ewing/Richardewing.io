apiVersion: governance.exogram.ai/v1alpha1
kind: BoundedCognitionPolicy
metadata:
  name: strict-context-compression
  description: "Defines the token retention priority for the LLM context window."
spec:
  # Hard Cognitive Limit
  max_context_tokens: 8000
  
  # Priority Tiers (P0 = Never drop, P4 = Drop first)
  priority_tiers:
    P0_CRITICAL:
      content: 
        - "System Prompt"
        - "Governance Directives"
        - "Repo Map Architecture"
      action: NEVER_TRUNCATE
      
    P1_IMMEDIATE_STATE:
      content:
        - "Current Target File AST"
        - "Current Error Log"
      action: TRUNCATE_IF_EXCEEDS_50_PERCENT_OF_MAX
      
    P2_RECENT_HISTORY:
      content:
        - "Last 3 Conversation Turns"
      action: SUMMARIZE_OR_TRUNCATE
      
    P3_STALE_HISTORY:
      content:
        - "Conversation turns 4-10"
      action: AGGRESSIVE_DROP
      
    P4_NOISE:
      content:
        - "Successful test logs"
        - "NPM install outputs"
      action: DROP_IMMEDIATELY
