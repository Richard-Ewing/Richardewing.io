# =====================================================================
# BRANCH INTEGRITY POLICY
# Framework: Repository Drift Prevention
# Purpose: Define explicit file-system boundaries for agent execution
# to prevent architectural drift and ghost dependencies.
# =====================================================================

apiVersion: governance.exogram.ai/v1alpha1
kind: ArchitecturalPolicy
metadata:
  name: strict-drift-prevention
  target_systems:
    - autonomous-feature-development
    - refactoring-agents
spec:
  enforcement_mode: "STRICT"

  authorized_scopes:
    # Example Scope: The agent is tasked with building frontend UI only
    frontend_component_task:
      allowed_directories:
        - "src/components/"
        - "src/styles/"
      banned_extensions:
        - ".yml"
        - ".yaml"
        - ".json"
        - ".sh"
      protected_files:
        - "package.json"
        - "next.config.ts"
        - "tailwind.config.ts"
        
    # Example Scope: The agent is tasked with fixing a backend bug
    backend_api_fix:
      allowed_directories:
        - "src/api/"
        - "src/lib/utils/"
      banned_extensions:
        - ".tsx"
        - ".jsx"
        - ".css"
      protected_files:
        - "package.json"
        - "prisma/schema.prisma"
        - ".env.example"
