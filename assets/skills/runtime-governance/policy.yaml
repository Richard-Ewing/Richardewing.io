# Runtime Governance Policy
version: "2.0.1"
runtime_layer: "Tool Governance"
domain: "Execution Containment"

command_classification:
  whitelisted:
    - "cat"
    - "ls"
    - "pwd"
    - "echo"
    - "grep"
    - "find"
    - "head"
    - "tail"
    - "wc"
  restricted:
    - "npm"
    - "npx"
    - "git"
    - "node"
    - "python"
  blacklisted:
    - "rm -rf"
    - "DROP TABLE"
    - "FORMAT"
    - "curl"  
    - "wget"
    - "ssh"
    - "scp"
    
file_protection:
  protected_patterns:
    - ".env*"
    - "*.key"
    - "*.pem"
    - "config/production*"
    - "docker-compose.prod*"
  max_files_per_operation: 5

human_escalation:
  on_blacklisted_command: "immediate"
  on_protected_file_access: "immediate"
  on_restricted_command: "queued"