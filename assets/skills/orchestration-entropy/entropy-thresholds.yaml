# =====================================================================
# ENTROPY THRESHOLDS POLICY
# Framework: Orchestration Entropy Governance
# Purpose: Define the absolute cryptographic limits on multi-agent interactions
# to prevent runaway compute burn and infinite loops.
# =====================================================================

apiVersion: governance.exogram.ai/v1alpha1
kind: EntropyPolicy
metadata:
  name: multi-agent-entropy-bounds
  target_systems:
    - langgraph-orchestrator
    - crewai-squads
    - autogen-conversations
spec:
  limits:
    # Maximum total conversational turns allowed per workflow execution
    # Prevents $1000 API bills from runaway chains.
    max_turns_per_workflow: 35
    
    # How deep sub-agents can recursively delegate tasks.
    # E.g. Manager -> Coder -> Reviewer -> Sub-Reviewer (Depth 4)
    max_delegation_depth: 3
    
    # How many times agents can message each other without invoking a tool.
    # Stops the "I agree, great plan, let's do it" loop.
    max_consecutive_agreements: 3

  escalation:
    # If entropy is breached, do we hard crash or pause for human intervention?
    action_on_breach: "PAUSE_AND_ALERT"
    alert_channel: "pagerduty:governance"
