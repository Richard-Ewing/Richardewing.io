# =====================================================================
# RETRY BUDGET POLICY
# Framework: Retry Inflation Control
# Purpose: Define absolute financial and compute circuit breakers
# to halt infinite patching loops.
# =====================================================================

apiVersion: governance.exogram.ai/v1alpha1
kind: BudgetPolicy
metadata:
  name: global-retry-limits
  target_systems:
    - autonomous-coding-agents
    - ci-cd-remediation-agents
spec:
  budgets:
    # Maximum API spend allowed for a single task objective
    max_usd_per_task: 2.50
    
    # Maximum consecutive errors an agent can hit before giving up
    max_consecutive_errors: 4
    
    # Absolute cap on total retries across the lifetime of the task
    max_total_retries: 10

  circuit_breaker:
    # If the agent receives the exact same stderr/stdout string this many times,
    # it is stuck in a loop and must be halted instantly.
    halt_on_identical_error_count: 3
