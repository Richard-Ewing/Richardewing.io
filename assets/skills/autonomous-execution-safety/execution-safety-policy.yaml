# =====================================================================
# EXECUTION SAFETY POLICY
# Framework: Autonomous Execution Safety
# Purpose: Define absolute cryptographic bounds on what an autonomous
# agent can execute in the host terminal.
# =====================================================================

apiVersion: governance.exogram.ai/v1alpha1
kind: SafetyPolicy
metadata:
  name: host-execution-containment
  target_systems:
    - autonomous-coding-agents
    - cli-wrappers
spec:
  enforcement_mode: "STRICT"

  denylist:
    exact_matches:
      - "rm -rf"
      - "rm -f"
      - "chmod -R"
      - "chown"
      - "mkfs"
      - "dd if="
      - "sudo"
      - "su -"
      - "curl"
      - "wget"
      - "nc "
      - "netcat"
      
    regex_patterns:
      # Block chaining commands which can hide malicious intent (e.g. `echo "rm -rf /" | bash`)
      - '\|.*bash'
      - '\|.*sh'
      # Block background execution
      - '&\\s*$'
      # Block evaluating strings as code
      - 'eval\\s+'
      # Block attempts to access environment variables directly in shell
      - '\\$AWS_'
      - '\\$STRIPE_'
      - '\\$DATABASE_URL'

  whitelist:
    allowed_base_commands:
      - "npm"
      - "yarn"
      - "pnpm"
      - "npx"
      - "git"
      - "ls"
      - "cd"
      - "cat"
      - "grep"
      - "find"
      - "tsc"
      - "jest"
      - "vitest"
      - "node"
