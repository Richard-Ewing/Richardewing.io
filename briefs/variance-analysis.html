<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Variance Analysis | Board Brief</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { obsidian: '#050505', surface: '#0f0f0f', titanium: '#C0C0C0', cobalt: '#0055FF', cyan: '#00F0FF' }, fontFamily: { mono: ['SF Mono', 'Menlo', 'monospace'], sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/scripts.js" defer></script>
</head>

<body class="overflow-x-hidden bg-obsidian text-gray-300 font-sans antialiased">
    <div class="max-w-[1800px] mx-auto grid grid-cols-1 lg:grid-cols-[320px_1fr] min-h-screen">
        <aside
            class="bg-black border-r border-zinc-800 p-8 lg:p-10 lg:sticky lg:top-0 lg:h-screen flex flex-col justify-between z-50">

            <div class="bg-surface border border-zinc-800 p-12 text-center relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black/80 pointer-events-none"></div>
                <div class="relative z-10">
                    <svg class="w-12 h-12 text-titanium mx-auto mb-6" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                        </path>
                    </svg>
                    <h3 class="text-2xl text-white font-bold mb-4">Subscriber Restricted</h3>
                    <p class="text-zinc-500 mb-8 max-w-md mx-auto">This specific brief is part of the deep-dive archive
                        available exclusively to distribution list subscribers.</p>
                    <form id="brief-form" action="https://formspree.io/f/xzddbpwy" method="POST"
                        class="w-full max-w-md mx-auto">
                        <div class="flex flex-col gap-4">
                            <input type="email" name="email" placeholder="enter_corporate_email" required
                                class="w-full bg-black border border-zinc-700 text-white px-6 py-4 focus:outline-none focus:border-cyan transition font-mono text-sm uppercase tracking-widest">

                            <button type="submit" id="submit-btn"
                                class="w-full bg-white text-black font-bold px-8 py-4 uppercase tracking-widest text-xs hover:bg-cyan transition">
                                Unlock Brief
                            </button>
                        </div>

                        <p id="status-message"
                            class="hidden text-cyan font-mono text-xs mt-4 text-center uppercase tracking-widest">
                            // ACCESS GRANTED. DOWNLOADING...
                        </p>
                    </form>

                    <script>
                        const form = document.getElementById("brief-form");
                        const status = document.getElementById("status-message");
                        const btn = document.getElementById("submit-btn");

                        // !!! IMPORTANT: CHANGE THIS LINK PER PAGE !!!
                        const PDF_URL = "https://richardewing.io/canonical/risk-advisory.html";

                        form.addEventListener("submit", async function (event) {
                            event.preventDefault();
                            const data = new FormData(event.target);

                            btn.innerHTML = "AUTHENTICATING...";
                            btn.disabled = true;

                            fetch(event.target.action, {
                                method: form.method,
                                body: data,
                                headers: { 'Accept': 'application/json' }
                            }).then(response => {
                                if (response.ok) {
                                    // 1. Show Success Message
                                    status.classList.remove("hidden");
                                    btn.innerHTML = "UNLOCKED";

                                    // 2. Trigger PDF Download
                                    window.location.href = PDF_URL;

                                    form.reset();
                                } else {
                                    btn.innerHTML = "ERROR. TRY AGAIN.";
                                    btn.disabled = false;
                                }
                            });
                        });
                    </script>
                </div>
            </div>
            </main>
    </div>
</body>

</html>
