<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#09090B" />
  
  <!-- Ribbon Flame / RE Monogram Emblem -->
  <g transform="translate(256, 256) scale(0.9) translate(-256, -256)" filter="url(#glow)">
    <!-- Main Drop Loop -->
    <path d="M 256 90 C 270 140 300 200 300 260 C 300 310 265 350 220 350 C 180 350 150 320 150 280 C 150 230 195 180 256 120 C 317 180 362 230 362 280 C 362 330 330 380 270 390 C 220 400 170 380 160 360" 
          fill="none" stroke="url(#neonGradient)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner Swirl & Cross Loop -->
    <path d="M 210 220 C 230 190 280 180 300 230 C 320 280 270 320 220 320 C 160 320 180 410 260 420 C 310 425 340 390 350 340" 
          fill="none" stroke="url(#neonGradient)" stroke-width="14" stroke-linecap="round" />
    <!-- Apex Flame Tip Accent -->
    <path d="M 256 90 L 256 140" fill="none" stroke="#00F0FF" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
