<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="brandGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="markGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  
  <!-- Background Container -->
  <rect width="600" height="140" rx="16" fill="#09090B"/>
  <rect x="1" y="1" width="598" height="138" rx="15" stroke="#27272A" stroke-width="1.5"/>
  
  <!-- Brand Emblem Mark -->
  <g transform="translate(32, 28)">
    <!-- Hexagon Outer -->
    <path d="M42 4 L76 24 L76 60 L42 80 L8 60 L8 24 Z" stroke="url(#brandGradDark)" stroke-width="3.5" fill="#18181B" stroke-linejoin="round"/>
    <!-- Inner Geometric Delta / Systems Vector -->
    <path d="M42 16 L64 54 L20 54 Z" stroke="url(#markGlow)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <circle cx="42" cy="16" r="3.5" fill="#34D399"/>
    <circle cx="64" cy="54" r="3.5" fill="#22D3EE"/>
    <circle cx="20" cy="54" r="3.5" fill="#10B981"/>
    <circle cx="42" cy="42" r="4.5" fill="url(#brandGradDark)"/>
  </g>
  
  <!-- Typography Group -->
  <g transform="translate(132, 52)">
    <!-- Title -->
    <text x="0" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#FAFAFA" letter-spacing="1.5">RICHARD EWING</text>
    <!-- Subtitle / Category -->
    <text x="2" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700" fill="#34D399" letter-spacing="3.5">AI ECONOMICS &amp; R&amp;D CAPITAL AUDITS</text>
  </g>
</svg>
